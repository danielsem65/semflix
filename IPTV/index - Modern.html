<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SemFlix Tv - Free IPTV Streaming</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://iptv-org.github.io">

<script defer src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html{
scroll-behavior:smooth;
}

:root{
--bg:#0f1117;
--panel:#171b22;
--card:#202733;
--card2:#283141;
--accent:#00b4ff;
--accent2:#3ad8ff;
--text:#ffffff;
--muted:#9ea8b7;
--border:#2d3645;
}

body{
background:var(--bg);
color:var(--text);
height:100vh;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* HEADER */

header{
position:sticky;
top:0;
z-index:1000;
background:rgba(15,17,23,.92);
backdrop-filter:blur(18px);
border-bottom:1px solid var(--border);
padding:18px 25px;
display:flex;
align-items:center;
justify-content:space-between;
}

.brand{
display:flex;
align-items:center;
gap:15px;
}

.logo{
width:52px;
height:52px;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
background:linear-gradient(135deg,var(--accent),#0ff);
box-shadow:0 0 25px rgba(0,180,255,.45);
}

.brand h1{
font-size:26px;
font-weight:700;
}

.brand p{
font-size:13px;
color:var(--muted);
}

.counter{
padding:10px 18px;
border-radius:30px;
background:var(--card);
border:1px solid var(--border);
font-size:14px;
}

/* LAYOUT */

.container{
flex:1;
display:flex;
overflow:hidden;
}

/* SIDEBAR */

.sidebar{
width:360px;
background:var(--panel);
display:flex;
flex-direction:column;
border-right:1px solid var(--border);
overflow:hidden;
}

.searchWrap{
position:sticky;
top:0;
z-index:999;
background:var(--panel);
padding:15px;
border-bottom:1px solid var(--border);
}

.searchWrap input{
width:100%;
padding:14px 18px;
border:none;
outline:none;
border-radius:14px;
background:var(--card);
color:white;
font-size:15px;
}

.searchWrap input::placeholder{
color:#8794a7;
}

#channels{
flex:1;
overflow-y:auto;
padding:10px;
}

#channels::-webkit-scrollbar{
width:8px;
}

#channels::-webkit-scrollbar-thumb{
background:#3a4658;
border-radius:20px;
}

/* CHANNEL CARD */

.channel{
display:flex;
align-items:center;
gap:14px;
padding:12px;
margin-bottom:10px;
background:var(--card);
border-radius:15px;
cursor:pointer;
transition:.25s;
border:1px solid transparent;
}

.channel:hover{
background:var(--card2);
transform:translateX(5px);
}

.channel.active{
border:1px solid var(--accent);
background:#14364c;
}

.channel img{
width:60px;
height:60px;
background:white;
border-radius:12px;
object-fit:contain;
padding:5px;
}

.channel .info{
display:flex;
flex-direction:column;
overflow:hidden;
}

.channel .info h3{
font-size:15px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.channel .info span{
font-size:12px;
color:var(--muted);
}

/* PLAYER */

.player{
flex:1;
display:flex;
justify-content:center;
align-items:center;
background:black;
position:relative;
}

video{
width:100%;
height:100%;
background:black;
object-fit:contain;
}

/* LOADER */

.loader{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:#000;
gap:18px;
z-index:20;
}

.spinner{
width:70px;
height:70px;
border-radius:50%;
border:7px solid #2b3442;
border-top-color:var(--accent);
animation:spin 1s linear infinite;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

.loader p{
color:#ccc;
}

/* HIDE NATIVE SEEK BAR */
video::-webkit-media-controls-timeline{
display:none!important;
}

video::-webkit-media-controls-current-time-display,
video::-webkit-media-controls-time-remaining-display{
display:none!important;
}

/* NOW PLAYING LIVE BADGE */

#playerOverlay{
position:absolute;
top:20px;
left:20px;
display:flex;
flex-direction:row;
align-items:center;
gap:10px;
z-index:5;
pointer-events:none;
}

#liveBadge{
display:inline-flex;
align-items:center;
gap:9px;
color:#ff2d3f;
font-size:12px;
font-weight:700;
letter-spacing:1.5px;
background:rgba(0,0,0,.55);
padding:6px 12px;
border-radius:20px;
backdrop-filter:blur(8px);
}

#liveDot{
width:9px;
height:9px;
border-radius:50%;
background:#ff2d3f;
animation:livePulse 1.1s ease-in-out infinite;
}

@keyframes livePulse{
0%{transform:scale(.8);box-shadow:0 0 0 0 rgba(255,45,63,.7);}
50%{transform:scale(1.25);box-shadow:0 0 14px 3px rgba(255,45,63,.8);}
100%{transform:scale(.8);box-shadow:0 0 0 0 rgba(255,45,63,0);}
}

#nowPlayingName{
background:rgba(0,0,0,.55);
padding:8px 14px;
border-radius:20px;
backdrop-filter:blur(8px);
font-size:14px;
font-weight:500;
width:max-content;
max-width:40vw;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

/* FOOTER */

footer{
height:48px;
display:flex;
align-items:center;
justify-content:center;
background:#11161d;
border-top:1px solid var(--border);
color:#8e99a8;
font-size:14px;
}

/* MOBILE */

@media(max-width:900px){

.container{
flex-direction:column;
}

.sidebar{
width:100%;
height:45%;
}

.player{
height:55%;
}

.brand h1{
font-size:20px;
}

.logo{
width:45px;
height:45px;
font-size:22px;
}

.counter{
display:none;
}

}

@media(max-width:600px){

header{
padding:15px;
}

.channel img{
width:48px;
height:48px;
}

.channel h3{
font-size:14px;
}

.brand p{
display:none;
}

}

</style>
</head>

<body>

<header>

<div class="brand">

<div class="logo">
📺
</div>

<div>
<h1>SemFlix TV</h1>
<p>Free IPTV Streaming</p>
</div>

</div>

<div class="counter">
<span id="count">Loading...</span>
</div>

</header>

<div class="container">

<div class="sidebar">

<div class="searchWrap">

<input
id="search"
type="text"
placeholder="🔍 Search channels...">

</div>

<div id="channels">

</div>

</div>

<div class="player">

<div class="loader" id="loader">

<div class="spinner"></div>

<p>Loading IPTV Playlist...</p>

</div>

<video
id="video"
controls
autoplay
playsinline
controlsList="nodownload noremoteplayback">
</video>

</div>

</div>

<footer>

SemDev Studio © 2026

</footer>

<script>

const PLAYLIST =
"https://iptv-org.github.io/iptv/index.m3u";

let channels=[];
let currentCard=null;

const list=document.getElementById("channels");
const video=document.getElementById("video");
const loader=document.getElementById("loader");
const count=document.getElementById("count");
const search=document.getElementById("search");

fetch(PLAYLIST)
.then(res=>res.text())
.then(parseM3U)
.catch(err=>{
loader.innerHTML="<p>Failed to load playlist.</p>";
console.error(err);
});

function parseM3U(text){

const lines=text.split("\n");

let channel={};

for(let line of lines){

line=line.trim();

if(line.startsWith("#EXTINF")){

channel={};

const name=line.split(",").pop().trim();

channel.name=name;

const logo=line.match(/tvg-logo="([^"]*)"/);
const group=line.match(/group-title="([^"]*)"/);
const country=line.match(/tvg-country="([^"]*)"/);

channel.logo=logo?logo[1]:"";
channel.group=group?group[1]:"General";
channel.country=country?country[1]:"";

}

else if(
line &&
!line.startsWith("#") &&
line.startsWith("http")
){

channel.url=line;

channels.push(channel);

}

}

count.innerHTML=channels.length+" Channels";

loader.style.display="none";

displayChannels(channels);

}

let renderTimer=null;

function displayChannels(data){

list.innerHTML="";
if(renderTimer) clearInterval(renderTimer);

const CHUNK=120;
let index=0;

renderTimer=setInterval(()=>{

const slice=data.slice(index,index+CHUNK);

slice.forEach(channel=>{

const card=document.createElement("div");

card.className="channel";
card.dataset.url=channel.url;

card.innerHTML=`

<img
src="${channel.logo}"
loading="lazy"
decoding="async"
onerror="this.src='https://placehold.co/60x60/1b2430/ffffff?text=TV'">

<div class="info">

<h3>${channel.name}</h3>

<span>${channel.group}</span>

</div>

`;

card.onclick=()=>{

playChannel(channel.url);

if(currentCard){
currentCard.classList.remove("active");
}

card.classList.add("active");
currentCard=card;

};

list.appendChild(card);

});

index+=CHUNK;

if(index>=data.length){
clearInterval(renderTimer);
renderTimer=null;
}

});

}

function playChannel(url){

if(window.hls){
window.hls.destroy();
}

if(Hls.isSupported()){

const hls=new Hls();

window.hls=hls;

hls.loadSource(url);

hls.attachMedia(video);

hls.on(Hls.Events.MANIFEST_PARSED,function(){

video.play();

});

}
else{

video.src=url;
video.play();

}

}

let searchTimer=null;

search.addEventListener("input",function(){

clearTimeout(searchTimer);

const keyword=this.value.toLowerCase();

searchTimer=setTimeout(()=>{

const filtered=channels.filter(channel=>{

return(
channel.name.toLowerCase().includes(keyword) ||
channel.group.toLowerCase().includes(keyword) ||
channel.country.toLowerCase().includes(keyword)
);

});

displayChannels(filtered);

},200);

});

// =========================
// AUTO PLAY FIRST CHANNEL
// =========================

let autoplayAttempts=0;

function tryAutoplay(){

    const saved = (function(){try{return localStorage.getItem(LAST_CHANNEL_KEY);}catch(e){return null;}})();

    if(saved){

        const target = document.querySelector('.channel[data-url="'+saved.replace(/"/g,'\\"')+'"]');

        if(target){
            target.click();
            scrollToChannel(target);
        } else if(autoplayAttempts++ < 100){
            setTimeout(tryAutoplay, 150);
        } else {
            const first = document.querySelector(".channel");
            if(first) first.click();
            else if(autoplayAttempts++ < 100) setTimeout(tryAutoplay, 150);
        }

    } else {

        const first = document.querySelector(".channel");

        if(first){
            first.click();
        } else if(autoplayAttempts++ < 40){
            setTimeout(tryAutoplay, 150);
        }

    }

}

function scrollToChannel(card){

    const list = document.getElementById("channels");

    const gap = Math.floor(list.clientHeight / 3);

    const pos = card.getBoundingClientRect().top - list.getBoundingClientRect().top + list.scrollTop - gap;

    list.scrollTop = Math.max(0, pos);

}

setTimeout(() => {

    if (typeof Hls !== "undefined") {
        tryAutoplay();
    } else {
        window.addEventListener("load", function(){
            setTimeout(tryAutoplay, 100);
        });
    }

}, 500);


// =========================
// NOW PLAYING OVERLAY + LIVE BADGE
// =========================

const nowPlaying = document.createElement("div");

nowPlaying.id = "playerOverlay";

nowPlaying.innerHTML = `
<div id="liveBadge"><span id="liveDot"></span>&nbsp;LIVE</div>
<div id="nowPlayingName">No Channel Selected</div>
`;

document.querySelector(".player").appendChild(nowPlaying);


// =========================
// REMEMBER LAST CHANNEL
// =========================

const LAST_CHANNEL_KEY = "streamverse_last_channel";

function rememberChannel(url){
    try{
        localStorage.setItem(LAST_CHANNEL_KEY, url);
    }catch(e){}
}


// Replace playChannel with an enhanced version
playChannel = function(url){

    if(window.hls){
        window.hls.destroy();
    }

    const channel = channels.find(c => c.url === url);

    if(channel){
        document.getElementById("nowPlayingName").innerHTML = channel.name;
        rememberChannel(url);
    }

    loader.style.display="flex";
    loader.querySelector("p").innerHTML="Loading Stream...";

    if(Hls.isSupported()){

        const hls = new Hls();

        window.hls = hls;

        hls.loadSource(url);

        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function(){

            loader.style.display="none";
            video.play();

        });

        hls.on(Hls.Events.ERROR,function(){

            loader.style.display="none";

        });

    }else{

        video.src=url;

        video.onloadeddata=function(){

            loader.style.display="none";
            video.play();

        };

    }

};


// =========================
// VIDEO EVENTS
// =========================

video.addEventListener("waiting",()=>{

    loader.style.display="flex";
    loader.querySelector("p").innerHTML="Buffering...";

});

video.addEventListener("playing",()=>{

    loader.style.display="none";

});

video.addEventListener("error",()=>{

    loader.style.display="none";

});


// =========================
// END
// =========================

</script>

</body>
</html>
